name: Security and test gate

on:
  pull_request:
  push:
    branches: [main, public-release-2026-04-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install locked runtime and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --constraint requirements.lock.txt \
            --requirement registry/requirements.txt \
            --requirement demo-node/requirements.txt \
            --requirement pilot-node/requirements.txt
          python -m pip install pip-audit bandit
      - name: Public release audit
        run: bash scripts/public-audit.sh
      - name: Compile and run full Python suite
        run: |
          python -m compileall -q demo-node/app/demo_node pilot-node/app/pilot_node registry p4p_core scripts
          python -m unittest discover -s tests -q
      - name: Dependency audit
        run: python -m pip_audit --requirement requirements.lock.txt
      - name: High-severity static analysis
        run: |
          targets=(p4p_core registry demo-node/app pilot-node/app scripts)
          if [ -d node-control ]; then targets+=(node-control); fi
          bandit --recursive "${targets[@]}" --exclude 'registry/.venv,tests' --severity-level high --confidence-level medium

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build non-root runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: p4p-host-candidate:ci
      - name: Scan runtime image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: p4p-host-candidate:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
