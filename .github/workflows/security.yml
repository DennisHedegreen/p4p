name: Security and test gate

on:
  pull_request:
  push:
    branches: [main, public-release-2026-04-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install locked runtime and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --constraint requirements.lock.txt \
            --requirement registry/requirements.txt \
            --requirement demo-node/requirements.txt \
            --requirement pilot-node/requirements.txt \
            --requirement requirements-test.txt
          python -m pip install pip-audit bandit
      - name: Public release audit
        run: bash scripts/public-audit.sh
      - name: Compile and run full Python suite
        run: |
          python -m compileall -q demo-node/app/demo_node pilot-node/app/pilot_node registry p4p_core scripts
          python -m unittest discover -s tests -q
      - name: Dependency audit
        run: python -m pip_audit --requirement requirements.lock.txt
      - name: High-severity static analysis
        run: |
          targets=(p4p_core registry demo-node/app pilot-node/app scripts)
          if [ -d node-control ]; then targets+=(node-control); fi
          bandit --recursive "${targets[@]}" --exclude 'registry/.venv,tests' --severity-level high --confidence-level medium

  ocr-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pilot runtime, test and OCR dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --constraint requirements.lock.txt \
            --requirement pilot-node/requirements.txt \
            --requirement requirements-test.txt \
            --requirement pilot-node/requirements-ocr.txt
      - name: Run OCR integration tests
        run: |
          python -m unittest -v \
            tests.test_v0_1_truthfulness.P4PTruthfulnessTests.test_menu_import_ocr_engine_uses_rapidocr_packaged_defaults \
            tests.test_v0_1_truthfulness.P4PTruthfulnessTests.test_pilot_node_menu_import_image_preview_extracts_draft_items_from_fixture \
            tests.test_v0_1_truthfulness.P4PTruthfulnessTests.test_pilot_node_menu_import_image_preview_requires_operator_token

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build non-root runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: p4p-host-candidate:ci
      - name: Scan runtime image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: p4p-host-candidate:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
