<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>P4P Pilot Operator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f5;
        --surface: #ffffff;
        --surface-2: #eef3f1;
        --line: #cfd8d5;
        --ink: #10201d;
        --muted: #51615d;
        --accent: #00796b;
        --accent-strong: #00594f;
        --warn: #a04b00;
        --bad: #b3261e;
        --ok: #16794c;
        --unknown: #60646c;
        --shadow: 0 10px 30px rgba(16, 32, 29, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        min-height: 42px;
        border-radius: 7px;
        padding: 0 14px;
        cursor: pointer;
        font-weight: 650;
      }

      button.secondary {
        background: #fff;
        color: var(--accent-strong);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      input,
      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 7px;
        padding: 0 10px;
      }

      main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 20px 14px 48px;
      }

      header {
        display: grid;
        gap: 16px;
        padding: 18px 0 14px;
        border-bottom: 1px solid var(--line);
      }

      @media (min-width: 880px) {
        header {
          grid-template-columns: minmax(0, 1fr) minmax(420px, 0.9fr);
          align-items: end;
        }
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(1.45rem, 3vw, 2.1rem);
        letter-spacing: 0;
      }

      h2 {
        font-size: 1rem;
      }

      h3 {
        font-size: 0.96rem;
      }

      .muted {
        color: var(--muted);
      }

      .token-row,
      .actions,
      .summary,
      .filters {
        display: grid;
        gap: 10px;
      }

      @media (min-width: 720px) {
        .token-row {
          grid-template-columns: minmax(0, 1fr) auto auto;
        }

        .actions {
          grid-template-columns: auto auto auto;
          justify-content: start;
        }

        .summary {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .filters {
          grid-template-columns: minmax(0, 1fr) 190px 190px;
        }
      }

      .toolbar {
        display: grid;
        gap: 10px;
      }

      .status-line {
        min-height: 24px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .summary {
        margin: 18px 0;
      }

      .metric {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 13px;
        min-height: 86px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .metric strong {
        display: block;
        margin-top: 7px;
        font-size: 1.1rem;
        word-break: break-word;
      }

      .layout {
        display: grid;
        gap: 16px;
      }

      @media (min-width: 980px) {
        .layout {
          grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
          align-items: start;
        }
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .panel-head {
        display: grid;
        gap: 12px;
        padding: 15px;
        border-bottom: 1px solid var(--line);
      }

      .panel-body {
        padding: 15px;
      }

      .module-list {
        display: grid;
        gap: 10px;
      }

      .module-row {
        display: grid;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 13px;
        background: #fff;
      }

      @media (min-width: 760px) {
        .module-row {
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: start;
        }
      }

      .module-title {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .module-id {
        font-weight: 750;
        word-break: break-word;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 0 8px;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 650;
      }

      .badge.ok {
        background: #e3f5ec;
        color: var(--ok);
      }

      .badge.warn {
        background: #fff1df;
        color: var(--warn);
      }

      .badge.bad {
        background: #fde7e4;
        color: var(--bad);
      }

      .badge.dark {
        background: #e7ecea;
        color: var(--ink);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .side {
        display: grid;
        gap: 10px;
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      .order-list {
        display: grid;
        gap: 10px;
      }

      .catalog-list {
        display: grid;
        gap: 10px;
      }

      .catalog-row {
        display: grid;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 13px;
        background: #fff;
      }

      .catalog-fields {
        display: grid;
        gap: 10px;
      }

      @media (min-width: 860px) {
        .catalog-fields {
          grid-template-columns: minmax(120px, 0.8fr) minmax(150px, 1fr) minmax(180px, 1.2fr) minmax(110px, 0.7fr) 100px 96px;
        }
      }

      .field {
        display: grid;
        gap: 5px;
      }

      .field label,
      .check-field span {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 650;
      }

      .check-field {
        display: flex;
        gap: 8px;
        align-items: end;
        min-height: 67px;
      }

      .check-field input {
        width: 18px;
        min-height: 18px;
      }

      .order-row {
        display: grid;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 13px;
        background: #fff;
      }

      @media (min-width: 760px) {
        .order-row {
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: start;
        }
      }

      .order-title {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .order-id {
        font-weight: 750;
        word-break: break-word;
      }

      .order-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-start;
      }

      dl {
        display: grid;
        grid-template-columns: minmax(100px, 0.45fr) minmax(0, 1fr);
        gap: 8px 12px;
        margin: 0;
      }

      dt {
        color: var(--muted);
      }

      dd {
        margin: 0;
        min-width: 0;
        word-break: break-word;
      }

      pre {
        margin: 0;
        max-height: 420px;
        overflow: auto;
        white-space: pre-wrap;
        background: #101815;
        color: #effaf4;
        border-radius: 8px;
        padding: 12px;
        font-size: 0.84rem;
      }

      .empty {
        padding: 22px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>P4P Pilot Operator</h1>
          <p class="muted" id="node-label">127.0.0.1</p>
        </div>
        <div class="toolbar">
          <div class="token-row">
            <input id="token" type="password" autocomplete="current-password" placeholder="Operator token">
            <button id="save-token" type="button">Use token</button>
            <button id="clear-token" class="secondary" type="button">Clear</button>
          </div>
          <div class="actions">
            <button id="refresh" type="button">Refresh</button>
            <button id="copy-json" class="secondary" type="button">Copy JSON</button>
          </div>
          <div class="status-line" id="status-line">Waiting for token.</div>
        </div>
      </header>

      <section class="summary" aria-label="Summary">
        <div class="metric">
          <span>Node</span>
          <strong id="metric-node">-</strong>
        </div>
        <div class="metric">
          <span>Payment</span>
          <strong id="metric-payment">-</strong>
        </div>
        <div class="metric">
          <span>Health</span>
          <strong id="metric-health">-</strong>
        </div>
        <div class="metric">
          <span>Modules</span>
          <strong id="metric-count">-</strong>
        </div>
      </section>

      <div class="layout">
        <div class="stack">
          <section class="panel">
            <div class="panel-head">
              <h2>Kitchen</h2>
              <p class="muted">Incoming and active pickup orders.</p>
            </div>
            <div class="panel-body">
              <div id="orders" class="order-list"></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Catalog</h2>
              <div class="actions">
                <button id="add-catalog-item" class="secondary" type="button">Add item</button>
                <button id="save-catalog" type="button">Save catalog</button>
              </div>
            </div>
            <div class="panel-body">
              <div id="catalog" class="catalog-list"></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Modules</h2>
              <div class="filters">
                <input id="search" type="search" placeholder="Search module id, provider, lane">
                <select id="lane-filter">
                  <option value="">All lanes</option>
                </select>
                <select id="health-filter">
                  <option value="">All health</option>
                  <option value="up">up</option>
                  <option value="available">available</option>
                  <option value="down">down</option>
                  <option value="not_configured">not_configured</option>
                  <option value="undeclared">undeclared</option>
                </select>
              </div>
            </div>
            <div class="panel-body">
              <div id="modules" class="module-list"></div>
            </div>
          </section>
        </div>

        <aside class="side">
          <section class="panel">
            <div class="panel-head">
              <h2>Node</h2>
            </div>
            <div class="panel-body">
              <dl id="node-details"></dl>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Response</h2>
            </div>
            <div class="panel-body">
              <pre id="raw">{}</pre>
            </div>
          </section>
        </aside>
      </div>
    </main>

    <script>
      const tokenInput = document.getElementById("token");
      const statusLine = document.getElementById("status-line");
      const modulesEl = document.getElementById("modules");
      const ordersEl = document.getElementById("orders");
      const catalogEl = document.getElementById("catalog");
      const rawEl = document.getElementById("raw");
      const searchInput = document.getElementById("search");
      const laneFilter = document.getElementById("lane-filter");
      const healthFilter = document.getElementById("health-filter");
      const nodeLabel = document.getElementById("node-label");
      const metricNode = document.getElementById("metric-node");
      const metricPayment = document.getElementById("metric-payment");
      const metricHealth = document.getElementById("metric-health");
      const metricCount = document.getElementById("metric-count");
      const nodeDetails = document.getElementById("node-details");

      const state = {
        modules: null,
        node: null,
        orders: [],
        menu: null
      };

      tokenInput.value = localStorage.getItem("p4pOperatorToken") || "";

      function setStatus(text, tone) {
        statusLine.textContent = text;
        statusLine.style.color = tone === "bad" ? "var(--bad)" : tone === "ok" ? "var(--ok)" : "var(--muted)";
      }

      function token() {
        return tokenInput.value.trim();
      }

      function headers() {
        return {
          "Content-Type": "application/json",
          "X-P4P-Operator-Token": token()
        };
      }

      async function request(path, options = {}) {
        const response = await fetch(path, {
          method: options.method || "GET",
          headers: headers(),
          body: options.body ? JSON.stringify(options.body) : undefined
        });
        if (!response.ok) {
          const detail = await response.text().catch(() => "");
          throw new Error(`HTTP ${response.status}${detail ? `: ${detail}` : ""}`);
        }
        return response.json();
      }

      function badge(text, tone) {
        const el = document.createElement("span");
        el.className = `badge ${tone || ""}`.trim();
        el.textContent = text;
        return el;
      }

      function healthTone(value) {
        if (value === "up" || value === "available") return "ok";
        if (value === "down" || value === "not_configured" || value === "undeclared") return "bad";
        if (value === "degraded") return "warn";
        return "";
      }

      function boolTone(value) {
        return value ? "ok" : "warn";
      }

      function statusTone(value) {
        if (value === "ready" || value === "completed") return "ok";
        if (value === "rejected" || value === "cancelled") return "bad";
        if (value === "accepted") return "dark";
        return "warn";
      }

      function visibleModules() {
        const payload = state.modules;
        if (!payload) return [];
        const query = searchInput.value.trim().toLowerCase();
        const lane = laneFilter.value;
        const health = healthFilter.value;
        return payload.modules.filter((entry) => {
          const haystack = [
            entry.module_id,
            entry.provider_id,
            entry.lane,
            entry.health,
            entry.implementation,
            entry.operator_status
          ].join(" ").toLowerCase();
          return (!query || haystack.includes(query)) &&
            (!lane || entry.lane === lane) &&
            (!health || entry.health === health);
        });
      }

      function renderLaneOptions(payload) {
        const current = laneFilter.value;
        const lanes = Array.from(new Set(payload.modules.map((entry) => entry.lane))).sort();
        laneFilter.innerHTML = '<option value="">All lanes</option>';
        for (const lane of lanes) {
          const option = document.createElement("option");
          option.value = lane;
          option.textContent = lane;
          option.selected = lane === current;
          laneFilter.appendChild(option);
        }
      }

      function renderPairs(target, pairs) {
        target.innerHTML = "";
        for (const [key, value] of pairs) {
          const dt = document.createElement("dt");
          const dd = document.createElement("dd");
          dt.textContent = key;
          dd.textContent = Array.isArray(value) ? value.join(", ") : String(value ?? "-");
          target.appendChild(dt);
          target.appendChild(dd);
        }
      }

      function renderModule(entry) {
        const row = document.createElement("article");
        row.className = "module-row";

        const main = document.createElement("div");
        const title = document.createElement("div");
        title.className = "module-title";
        const id = document.createElement("span");
        id.className = "module-id";
        id.textContent = entry.module_id;
        title.appendChild(id);
        title.appendChild(badge(entry.health, healthTone(entry.health)));
        if (entry.active) title.appendChild(badge("active", "dark"));
        if (!entry.declared) title.appendChild(badge("undeclared", "bad"));
        if (!entry.configured) title.appendChild(badge("config", "warn"));
        main.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.appendChild(document.createTextNode(`${entry.provider_id || "no provider"} / ${entry.lane}`));
        meta.appendChild(document.createTextNode(entry.implementation));
        meta.appendChild(document.createTextNode(entry.operator_status || entry.status || ""));
        main.appendChild(meta);

        const side = document.createElement("div");
        side.className = "badges";
        side.appendChild(badge(entry.configured ? "configured" : "missing", boolTone(entry.configured)));
        side.appendChild(badge(entry.executable ? "executable" : "not executable", boolTone(entry.executable)));
        side.appendChild(badge(entry.readiness || "unknown"));
        if (entry.lane === "payment" && entry.declared) {
          const action = document.createElement("button");
          action.type = "button";
          action.className = entry.active ? "" : "secondary";
          action.textContent = entry.active ? "Active" : "Set active";
          action.disabled = entry.active;
          action.addEventListener("click", () => {
            setActivePayment(entry.module_id).catch((error) => setStatus(error.message, "bad"));
          });
          side.appendChild(action);
        }
        row.appendChild(main);
        row.appendChild(side);

        if (entry.health_reason || entry.missing_configuration?.length) {
          const reason = document.createElement("div");
          reason.className = "meta";
          const missing = entry.missing_configuration?.length
            ? `missing: ${entry.missing_configuration.join(", ")}`
            : "";
          reason.textContent = [entry.health_reason, missing].filter(Boolean).join(" | ");
          row.appendChild(reason);
        }

        return row;
      }

      function orderItemsText(order) {
        return (order.items || [])
          .map((item) => `${item.quantity} x ${item.id}`)
          .join(", ");
      }

      function catalogInput(labelText, name, value, type = "text") {
        const field = document.createElement("div");
        field.className = "field";
        const label = document.createElement("label");
        label.textContent = labelText;
        const input = document.createElement("input");
        input.name = name;
        input.type = type;
        input.value = value ?? "";
        if (name === "price") {
          input.min = "0";
          input.step = "1";
        }
        field.appendChild(label);
        field.appendChild(input);
        return field;
      }

      function renderCatalog() {
        catalogEl.innerHTML = "";
        const items = state.menu?.items || [];
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No catalog items";
          catalogEl.appendChild(empty);
          return;
        }

        for (const item of items) {
          const row = document.createElement("article");
          row.className = "catalog-row";
          const fields = document.createElement("div");
          fields.className = "catalog-fields";
          fields.appendChild(catalogInput("ID", "id", item.id));
          fields.appendChild(catalogInput("Name", "name", item.name));
          fields.appendChild(catalogInput("Description", "description", item.description));
          fields.appendChild(catalogInput("Category", "category", item.category));
          fields.appendChild(catalogInput("Price (minor units)", "price", item.price, "number"));
          fields.appendChild(catalogInput("Image URL", "image_url", item.image_url));

          const activeField = document.createElement("label");
          activeField.className = "check-field";
          const active = document.createElement("input");
          active.name = "active";
          active.type = "checkbox";
          active.checked = item.active !== false;
          const activeText = document.createElement("span");
          activeText.textContent = "Active";
          activeField.appendChild(active);
          activeField.appendChild(activeText);
          fields.appendChild(activeField);
          row.appendChild(fields);

          const actions = document.createElement("div");
          actions.className = "actions";
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "secondary";
          remove.textContent = "Remove";
          remove.addEventListener("click", () => {
            row.remove();
          });
          actions.appendChild(remove);
          row.appendChild(actions);
          catalogEl.appendChild(row);
        }
      }

      function addCatalogItem() {
        const items = state.menu?.items ? [...state.menu.items] : [];
        items.push({
          id: `item-${Date.now().toString(36)}`,
          name: "New item",
          description: "",
          price: 0,
          category: "pizza",
          active: true,
          image_url: ""
        });
        state.menu = {
          currency: state.menu?.currency || "DKK",
          updated_at: state.menu?.updated_at || new Date().toISOString(),
          items
        };
        renderCatalog();
      }

      function readCatalogItems() {
        const rows = Array.from(catalogEl.querySelectorAll(".catalog-row"));
        return rows.map((row) => {
          const value = (name) => row.querySelector(`[name="${name}"]`)?.value.trim() || "";
          return {
            id: value("id"),
            name: value("name"),
            description: value("description"),
            price: Number.parseInt(value("price") || "0", 10),
            category: value("category"),
            active: Boolean(row.querySelector('[name="active"]')?.checked),
            image_url: value("image_url") || null
          };
        });
      }

      function orderAction(order, label, nextStatus, message) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = ["accepted", "ready", "completed"].includes(nextStatus) ? "" : "secondary";
        button.textContent = label;
        button.disabled = order.status === nextStatus || order.status === "completed" || order.status === "cancelled";
        button.addEventListener("click", () => {
          updateOrder(order.order_id, nextStatus, message).catch((error) => setStatus(error.message, "bad"));
        });
        return button;
      }

      function renderKitchen() {
        ordersEl.innerHTML = "";
        const orders = state.orders || [];
        if (!orders.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No orders";
          ordersEl.appendChild(empty);
          return;
        }

        for (const order of orders) {
          const row = document.createElement("article");
          row.className = "order-row";

          const main = document.createElement("div");
          const title = document.createElement("div");
          title.className = "order-title";
          const id = document.createElement("span");
          id.className = "order-id";
          id.textContent = order.order_id;
          title.appendChild(id);
          title.appendChild(badge(order.status, statusTone(order.status)));
          title.appendChild(badge(order.payment_method || "payment unknown"));
          main.appendChild(title);

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.appendChild(document.createTextNode(`${order.customer_name} / ${order.customer_contact}`));
          meta.appendChild(document.createTextNode(orderItemsText(order)));
          meta.appendChild(document.createTextNode(order.note || ""));
          main.appendChild(meta);

          if (order.status_message) {
            const message = document.createElement("div");
            message.className = "meta";
            message.textContent = order.status_message;
            main.appendChild(message);
          }

          const actions = document.createElement("div");
          actions.className = "order-actions";
          actions.appendChild(orderAction(order, "Accept", "accepted", "Accepted in kitchen."));
          actions.appendChild(orderAction(order, "Ready", "ready", "Ready for pickup."));
          actions.appendChild(orderAction(order, "Complete", "completed", "Completed."));
          actions.appendChild(orderAction(order, "Reject", "rejected", "Rejected by kitchen."));
          actions.appendChild(orderAction(order, "Cancel", "cancelled", "Cancelled by kitchen."));

          row.appendChild(main);
          row.appendChild(actions);
          ordersEl.appendChild(row);
        }
      }

      function renderModules() {
        modulesEl.innerHTML = "";
        const modules = visibleModules();
        if (!modules.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No modules";
          modulesEl.appendChild(empty);
          return;
        }
        for (const entry of modules) {
          modulesEl.appendChild(renderModule(entry));
        }
      }

      function renderSummary() {
        const modules = state.modules;
        const node = state.node;
        const activePayment = modules?.active_by_lane?.payment || "-";
        const activePaymentEntry = modules?.modules.find((entry) => entry.module_id === activePayment);
        nodeLabel.textContent = `${location.origin}/operator`;
        metricNode.textContent = node?.node?.node_id || modules?.node_id || "-";
        metricPayment.textContent = activePayment;
        metricHealth.textContent = activePaymentEntry?.health || "-";
        metricCount.textContent = String(modules?.modules?.length || 0);
        renderPairs(nodeDetails, [
          ["Open", node?.node?.open],
          ["Order mode", node?.node?.order_mode],
          ["Accepts orders", node?.accepts_orders],
          ["Orders", state.orders?.length || 0],
          ["Catalog items", state.menu?.items?.length || 0],
          ["Public modules", node?.public_modules],
          ["Undeclared", modules?.undeclared_modules?.map((entry) => entry.module_id) || []],
          ["Checked", modules?.checked_at]
        ]);
      }

      function render() {
        renderKitchen();
        renderCatalog();
        if (state.modules) {
          renderLaneOptions(state.modules);
          renderModules();
          rawEl.textContent = JSON.stringify({ modules: state.modules, state: state.node, orders: state.orders, menu: state.menu }, null, 2);
        }
        renderSummary();
      }

      async function saveCatalog() {
        const items = readCatalogItems();
        if (!items.length) {
          setStatus("Catalog needs at least one item.", "bad");
          return;
        }
        setStatus("Saving catalog.");
        state.menu = await request("/operator/menu", {
          method: "PUT",
          body: { items }
        });
        await refresh();
        setStatus("Catalog saved.", "ok");
      }

      async function setActivePayment(moduleId) {
        if (!token()) {
          setStatus("Waiting for token.", "bad");
          return;
        }
        setStatus(`Setting ${moduleId} active.`);
        const modules = await request("/operator/modules/payment", {
          method: "PATCH",
          body: { module_id: moduleId }
        });
        state.modules = modules;
        render();
        setStatus("Payment module updated.", "ok");
      }

      async function updateOrder(orderId, nextStatus, message) {
        setStatus(`Updating ${orderId}.`);
        await request(`/operator/orders/${encodeURIComponent(orderId)}`, {
          method: "PATCH",
          body: {
            status: nextStatus,
            status_message: message
          }
        });
        await refresh();
        setStatus("Order updated.", "ok");
      }

      async function refresh() {
        if (!token()) {
          setStatus("Waiting for token.", "bad");
          return;
        }
        setStatus("Loading.");
        const [modules, node, orders, menu] = await Promise.all([
          request("/operator/modules"),
          request("/operator/state"),
          request("/operator/orders"),
          request("/operator/menu")
        ]);
        state.modules = modules;
        state.node = node;
        state.orders = orders;
        state.menu = menu;
        render();
        setStatus("Updated.", "ok");
      }

      document.getElementById("save-token").addEventListener("click", () => {
        localStorage.setItem("p4pOperatorToken", token());
        refresh().catch((error) => setStatus(error.message, "bad"));
      });

      document.getElementById("clear-token").addEventListener("click", () => {
        localStorage.removeItem("p4pOperatorToken");
        tokenInput.value = "";
        setStatus("Token cleared.");
      });

      document.getElementById("refresh").addEventListener("click", () => {
        refresh().catch((error) => setStatus(error.message, "bad"));
      });

      document.getElementById("add-catalog-item").addEventListener("click", addCatalogItem);

      document.getElementById("save-catalog").addEventListener("click", () => {
        saveCatalog().catch((error) => setStatus(error.message, "bad"));
      });

      document.getElementById("copy-json").addEventListener("click", () => {
        navigator.clipboard.writeText(rawEl.textContent)
          .then(() => setStatus("Copied JSON.", "ok"))
          .catch((error) => setStatus(error.message, "bad"));
      });

      searchInput.addEventListener("input", renderModules);
      laneFilter.addEventListener("change", renderModules);
      healthFilter.addEventListener("change", renderModules);

      if (token()) {
        refresh().catch((error) => setStatus(error.message, "bad"));
      }
    </script>
  </body>
</html>
